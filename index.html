
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8fafc">

  <title>Banglish to Bangla</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #172033;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 740px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 12px 40px #0f172a0a;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      letter-spacing: -0.8px;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #64748b;
      line-height: 1.6;
    }

    label {
      display: block;
      font-weight: 650;
      margin-bottom: 10px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 150px;
      padding: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.7;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px #0f766e18;
    }

    .input-info {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      color: #64748b;
      font-size: 13px;
    }

    #status {
      min-height: 24px;
      margin: 18px 0;
      color: #64748b;
      font-size: 14px;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .result-header label {
      margin: 0;
    }

    #copy {
      border: 0;
      border-radius: 10px;
      padding: 9px 15px;
      background: #e2e8f0;
      color: #172033;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition: background 0.2s;
    }

    #copy:hover {
      background: #cbd5e1;
    }

    #result {
      min-height: 110px;
      padding: 18px;
      border-radius: 12px;
      background: #f1f5f9;
      font-size: 23px;
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #result.empty {
      color: #94a3b8;
      font-size: 16px;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
    }

    @media (max-width: 520px) {
      body {
        padding: 14px;
      }

      main {
        padding: 22px;
        border-radius: 16px;
      }

      h1 {
        font-size: 25px;
      }

      #result {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Banglish to Bangla</h1>

    <p class="subtitle">
      Type Banglish and get Bangla script automatically.
    </p>

    <form id="convert-form">
      <label for="input-text">Enter Banglish text</label>

      <textarea
        id="input-text"
        maxlength="1000"
        placeholder="Example: ami valo achi"
        autocomplete="off"
        spellcheck="false"
        required
      ></textarea>

      <div class="input-info">
        <span>Conversion happens automatically</span>
        <span id="char-count">0 / 1000</span>
      </div>
    </form>

    <p id="status" role="status" aria-live="polite">
      Start typing to convert.
    </p>

    <div class="result-header">
      <label for="result">Bangla output</label>
      <button id="copy" type="button">Copy</button>
    </div>

    <div
      id="result"
      class="empty"
      aria-live="polite"
      aria-label="Bangla output"
    >Your converted text will appear here.</div>

    <div class="footer">
      Powered by your fine-tuned Banglish-to-Bangla model
    </div>
  </main>

  <script>
    const form = document.getElementById("convert-form");
    const input = document.getElementById("input-text");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const copyButton = document.getElementById("copy");
    const charCount = document.getElementById("char-count");

    let debounceTimer;
    let requestNumber = 0;
    let activeController = null;

    const PLACEHOLDER = "Your converted text will appear here.";

    async function convertText() {
      const text = input.value.trim();
      const currentRequest = ++requestNumber;

      if (activeController) {
        activeController.abort();
        activeController = null;
      }

      if (!text) {
        result.textContent = PLACEHOLDER;
        result.classList.add("empty");
        status.textContent = "Start typing to convert.";
        return;
      }

      const controller = new AbortController();
      activeController = controller;

      status.textContent = "Converting...";
      result.classList.add("empty");

      try {
        const response = await fetch("/convert", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ text }),
          signal: controller.signal
        });

        const data = await response.json();

        if (currentRequest !== requestNumber) return;

        if (!response.ok) {
          throw new Error(
            typeof data.detail === "string"
              ? data.detail
              : "Conversion failed. Please try again."
          );
        }

        result.textContent = data.output || "";
        result.classList.toggle("empty", !data.output);
        status.textContent = "Conversion complete.";
      } catch (error) {
        if (error.name === "AbortError") return;
        if (currentRequest !== requestNumber) return;

        status.textContent =
          error.message || "Unable to connect to the server.";
      } finally {
        if (currentRequest === requestNumber) {
          activeController = null;
        }
      }
    }

    input.addEventListener("input", () => {
      charCount.textContent = `${input.value.length} / 1000`;

      clearTimeout(debounceTimer);

      // Invalidate an older request immediately when text changes.
      requestNumber++;

      if (activeController) {
        activeController.abort();
        activeController = null;
      }

      if (!input.value.trim()) {
        result.textContent = PLACEHOLDER;
        result.classList.add("empty");
        status.textContent = "Start typing to convert.";
        return;
      }

      status.textContent = "Waiting for you to finish typing...";

      // Wait 700 ms after the last keystroke.
      debounceTimer = setTimeout(convertText, 700);
    });

    // Prevent a page reload when Enter is pressed.
    form.addEventListener("submit", (event) => {
      event.preventDefault();
    });

    copyButton.addEventListener("click", async () => {
      const output = result.textContent;

      if (!output || output === PLACEHOLDER) {
        status.textContent = "There is no output to copy yet.";
        return;
      }

      try {
        await navigator.clipboard.writeText(output);
        status.textContent = "Bangla output copied!";
      } catch {
        status.textContent =
          "Copy failed. Please select and copy the output.";
      }
    });
  </script>
</body>
</html>
